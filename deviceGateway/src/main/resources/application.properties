spring.application.name=deviceGateway
server.port=8080

# Configuração Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.override-with-generic-response=false

# Security api key from IOT
gateway.api.key={GATEWAY_API_KEY}

# Configuração de conexão do Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}

# Serializadores do Producer (Chave em String, Valor em JSON)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Mantém o payload agnóstico no tópico
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Tópico padrão de ingestão
spring.kafka.template.default-topic=telemetry.ingestion
# Exposição restrita e segura dos endpoints essenciais
management.endpoints.web.exposure.include=health,prometheus

# Identificação da aplicação nas métricas do Prometheus
management.metrics.tags.application=${spring.application.name}

# Habilita explicitamente a exportação para o Prometheus
management.prometheus.metrics.export.enabled=true