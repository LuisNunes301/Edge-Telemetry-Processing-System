services:
  postgres:
    image: postgres:15-alpine
    container_name: telemetry-db
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telemetry-network

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: telemetry-kafka
    ports:
      - "${KAFKA_PORT}:${KAFKA_PORT}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://telemetry-kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT}
      KAFKA_LISTENERS: PLAINTEXT://telemetry-kafka:29092,CONTROLLER://telemetry-kafka:${KAFKA_CONTROLLER_PORT},PLAINTEXT_HOST://0.0.0.0:${KAFKA_PORT}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@telemetry-kafka:${KAFKA_CONTROLLER_PORT}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - telemetry-network

  gateway:
    build:
      context: ./deviceGateway 
      dockerfile: Dockerfile
    container_name: telemetry-gateway
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: telemetry-kafka:29092
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - kafka
    networks:
      - telemetry-network
      
  processor:
    build:
      context: ./telemetryProcessor
      dockerfile: Dockerfile
    container_name: telemetry-processor
    ports:
      - "${PROCESSOR_PORT}:${PROCESSOR_PORT}"
    environment:
      POSTGRES_HOST: telemetry-db
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: telemetry-kafka:29092
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - telemetry-network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT}:${PROMETHEUS_PORT}"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - telemetry-network
    deploy:
      resources:
        limits:
          memory: 256M 
          cpus: '0.50'  

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    ports:
      - "${GRAFANA_PORT}:${GRAFANA_PORT}"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    networks:
      - telemetry-network
    deploy:
      resources:
        limits:
          memory: 256M 
          cpus: '0.50'  
  # charge test
  simulator:
    build: ./scriptEdge
    container_name: telemetry-simulator
    environment:
      - API_URL=http://gateway:8080/api/telemetry
    depends_on:
      - gateway
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - telemetry-network
volumes:
  postgres_data:
  kafka_data:

networks:
  telemetry-network:
    driver: bridge