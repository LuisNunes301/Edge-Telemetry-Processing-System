# Configuração do Servidor e Aplicação
server.port=8081
spring.application.name=telemetry-processor

# Conexão com o PostgreSQL (utilizando variáveis do .env ou fallbacks para local)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:telemetry_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuração do Consumidor Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=telemetry-processor-group-v2
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Exposição restrita e segura dos endpoints essenciais
management.endpoints.web.exposure.include=health,prometheus

# Identificação da aplicação nas métricas do Prometheus
management.metrics.tags.application=${spring.application.name}

# Habilita explicitamente a exportação para o Prometheus
management.prometheus.metrics.export.enabled=true